<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Modul Praktikum Kimia Berbasis Virtual Lab: Laju Reaksi</title>
  <style>
    :root {
      --bg: #e8eef4;
      --paper: #fffdf8;
      --ink: #1f2933;
      --mut: #5b6b7a;
      --acc: #0f766e;
      --acc2: #b45309;
      --line: #d8e0e7;
      --box: #ecf6f4;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #10171d;
        --mut: #8da0b0;
      }
    }

    :root[data-theme="dark"] {
      --bg: #10171d;
      --mut: #8da0b0;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    #book {
      perspective: 1800px;
      width: 100%;
      max-width: 640px;
    }

    .page {
      background: var(--paper);
      color: var(--ink);
      border-radius: 6px 14px 14px 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 8px 0 12px -8px rgba(0,0,0,.25);
      padding: 26px 24px 20px;
      min-height: 600px;
      transform-origin: left center;
      position: relative;
    }

    .page.out { animation: out .35s ease-in forwards; }
    .page.in { animation: inn .35s ease-out; }
    .page.outb { animation: outb .35s ease-in forwards; }
    .page.inb { animation: innb .35s ease-out; }

    @keyframes out { to { transform: rotateY(-70deg); opacity: 0; } }
    @keyframes inn { from { transform: rotateY(60deg); opacity: 0; } }
    @keyframes outb { to { transform: rotateY(70deg); opacity: 0; } }
    @keyframes innb { from { transform: rotateY(-60deg); opacity: 0; } }

    h1, h2, h3 {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      margin: .2em 0 .5em;
    }

    h2 {
      color: var(--acc);
      font-size: 1.35rem;
      border-bottom: 2px solid var(--line);
      padding-bottom: 6px;
    }

    h3 {
      font-size: 1.02rem;
      color: var(--acc2);
      margin-top: 1em;
    }

    p, li {
      line-height: 1.55;
      font-size: .95rem;
    }

    ul, ol {
      padding-left: 20px;
      margin: .4em 0;
    }

    .box {
      background: var(--box);
      border-left: 4px solid var(--acc);
      padding: 8px 12px;
      border-radius: 4px;
      margin: 10px 0;
      font-size: .92rem;
    }

    .warn {
      background: #fff3e0;
      border-left-color: #e65100;
      color: #4a2a00;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: .85rem;
      margin: 8px 0;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 5px 7px;
      text-align: left;
    }

    th {
      background: var(--box);
    }

    .fill td {
      height: 26px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin: 10px 0;
    }

    figure {
      margin: 0;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: .78rem;
      color: var(--mut);
      background: #f4f8fb;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
    }

    figure svg {
      width: 100%;
      height: auto;
      max-height: 110px;
    }

    figcaption b {
      color: var(--acc);
    }

    .cover {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(160deg, #0f766e, #134e4a);
      color: #fff;
    }

    .cover h1 {
      font-size: 1.7rem;
      line-height: 1.25;
    }

    .cover p {
      color: #d6f1ec;
    }

    a.vid {
      display: block;
      margin: 8px 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-decoration: none;
      color: var(--ink);
      background: #fff;
    }

    a.vid b {
      color: #c62828;
    }

    a.vid span {
      display: block;
      font-size: .8rem;
      color: var(--mut);
      font-family: Arial, sans-serif;
    }

    .nav {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      font-family: Arial, sans-serif;
    }

    .nav button {
      background: var(--acc);
      color: #fff;
      border: 0;
      border-radius: 20px;
      padding: 10px 20px;
      font-size: .95rem;
      cursor: pointer;
    }

    .nav button:disabled {
      opacity: .35;
    }

    .nav select {
      padding: 8px;
      border-radius: 8px;
      max-width: 160px;
    }

    .nav span {
      color: var(--mut);
      font-size: .85rem;
    }

    .pg {
      position: absolute;
      bottom: 6px;
      right: 14px;
      font: .72rem Arial;
      color: var(--mut);
    }
  </style>
</head>
<body>

  <div id="book"></div>
  
  <div class="nav">
    <button id="prev">‹ Sebelumnya</button>
    <select id="jump"></select>
    <span id="cnt"></span>
    <button id="next">Berikutnya ›</button>
  </div>

  <script>
    const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
    
    // Ilustrasi komponen SVG
    const bk = (c, l, o = {}) => 
      `<svg viewBox="0 0 90 100">
        <path d="M22 18v62q0 8 8 8h30q8 0 8-8V18" fill="none" stroke="#6b7c8c" stroke-width="3"/>
        <path d="M24 ${o.h || 48}v32q0 6 6 6h30q6 0 6-6V${o.h || 48}z" fill="${c}" opacity=".85"/>
        ${o.drop ? `<path d="M45 4q-6 9-6 13a6 6 0 0012 0q0-4-6-13z" fill="${o.drop}"/>` : ''}
        ${o.paper ? `<rect x="52" y="6" width="9" height="40" fill="${o.paper}" stroke="#555" transform="rotate(12 56 26)"/>` : ''}
        <text x="45" y="97" font-size="9" text-anchor="middle" fill="#444">${l}</text>
      </svg>`;
      
    const fig = (svg, t, n) => 
      `<figure>
        ${svg}
        <figcaption><b>${n}.</b> ${t}</figcaption>
      </figure>`;
      
    const tit = 
      `<svg viewBox="0 0 90 100">
        <rect x="40" y="2" width="10" height="46" fill="#e8f1f8" stroke="#6b7c8c" stroke-width="2"/>
        <rect x="41" y="20" width="8" height="28" fill="#f8c8d4"/>
        <path d="M45 48v8" stroke="#6b7c8c" stroke-width="2"/>
        <circle cx="45" cy="60" r="2.5" fill="#f06292"/>
        <path d="M35 68h20l10 22q2 6-4 6H29q-6 0-4-6z" fill="#f8c8d4" stroke="#6b7c8c" stroke-width="2.5"/>
      </svg>`;
      
    const ph = (c, v) => 
      `<svg viewBox="0 0 90 100">
        <rect x="38" y="4" width="14" height="60" rx="4" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
        <rect x="42" y="64" width="6" height="22" fill="#90a4ae"/>
        <rect x="30" y="14" width="30" height="16" fill="${c}"/>
        <text x="45" y="26" font-size="11" text-anchor="middle" fill="#000">${v}</text>
      </svg>`;
      
    const sw = t => 
      `<svg viewBox="0 0 90 100">
        <circle cx="45" cy="56" r="32" fill="#fff" stroke="#546e7a" stroke-width="4"/>
        <rect x="39" y="12" width="12" height="8" fill="#546e7a"/>
        <path d="M45 56V34M45 56l14 8" stroke="#d32f2f" stroke-width="3"/>
        <text x="45" y="98" font-size="9" text-anchor="middle" fill="#444">${t}</text>
      </svg>`;
      
    const th = (c, t) => 
      `<svg viewBox="0 0 90 100">
        <rect x="40" y="6" width="10" height="64" rx="5" fill="#fff" stroke="#607d8b" stroke-width="2"/>
        <circle cx="45" cy="78" r="10" fill="${c}"/>
        <rect x="43" y="${80 - c.length * 0 - 40}" width="4" height="${40}" fill="${c}"/>
        <text x="45" y="98" font-size="9" text-anchor="middle" fill="#444">${t}</text>
      </svg>`;
      
    const tab = (c, l, n) => 
      `<svg viewBox="0 0 90 100">
        <path d="M22 18v62q0 8 8 8h30q8 0 8-8V18" fill="none" stroke="#6b7c8c" stroke-width="3"/>
        <path d="M24 40v40q0 6 6 6h30q6 0 6-6V40z" fill="${c}" opacity=".7"/>
        ${n}
        <text x="45" y="97" font-size="9" text-anchor="middle" fill="#444">${l}</text>
      </svg>`;
      
    const bub = [[34, 60], [48, 52], [56, 68], [40, 74], [50, 44]]
      .map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff"/>`).join('');
      
    const whole = '<rect x="38" y="68" width="16" height="8" rx="3" fill="#fafafa" stroke="#999"/>';
    const crush = '<circle cx="36" cy="78" r="2" fill="#fafafa"/><circle cx="44" cy="80" r="2" fill="#fafafa"/><circle cx="52" cy="78" r="2" fill="#fafafa"/><circle cx="48" cy="76" r="2" fill="#fafafa"/>';
    
    const mk = (a, b) => 
      `<svg viewBox="0 0 350 70" width="100%">
        <rect width="350" height="70" fill="none"/>
        <text x="4" y="14" font-size="11" fill="#777" font-family="Arial">${a}</text>
        ${b}
      </svg>`;

    // Konten Halaman
    const pages = [
      ['Sampul', 
        `<div class="page cover">
          ${sw('').replace('<svg', '<svg width="110"')}
          <h1>MODUL PRAKTIKUM KIMIA<br>BERBASIS VIRTUAL LAB</h1>
          <p style="font-size:1.15rem">Materi Laju Reaksi</p>
          <p>Kelas XI SMA/MA · Fase F</p>
          <p style="margin-top:30px;font-size:.85rem">Nama: ____________________<br>Kelas/Kelompok: ____________</p>
        </div>`
      ],
      ['Petunjuk & Capaian', 
        `<div class="page">
          <h2>Petunjuk Penggunaan Modul</h2>
          <ol>
            <li>Baca tujuan dan aturan keselamatan sebelum praktikum.</li>
            <li>Lakukan praktikum nyata <i>atau</i> virtual (PhET) sesuai ketersediaan alat.</li>
            <li>Ikuti gambar prosedur, ukur waktu dengan stopwatch, dan catat data pada tabel.</li>
            <li>Tonton video pendukung agar teknik kerja jelas.</li>
            <li>Jawab pertanyaan diskusi dan buat kesimpulan.</li>
          </ol>
          <h3>Capaian Pembelajaran</h3>
          <p>Peserta didik mampu menjelaskan teori tumbukan, menganalisis pengaruh konsentrasi, luas permukaan, suhu, dan katalis terhadap laju reaksi, serta menentukan orde reaksi dari data percobaan.</p>
          <h3>Daftar Kegiatan</h3>
          <table>
            <tr><th>No</th><th>Kegiatan</th><th>Hal.</th></tr>
            <tr><td>1</td><td>Pengaruh konsentrasi</td><td>5</td></tr>
            <tr><td>2</td><td>Pengaruh luas permukaan</td><td>6</td></tr>
            <tr><td>3</td><td>Pengaruh suhu</td><td>7</td></tr>
            <tr><td>4</td><td>Pengaruh katalis</td><td>8</td></tr>
            <tr><td>5</td><td>Praktikum virtual PhET</td><td>9</td></tr>
          </table>
          <span class="pg">2</span>
        </div>`
      ],
      ['Keselamatan', 
        `<div class="page">
          <h2>Tujuan &amp; Keselamatan Kerja</h2>
          <h3>Tujuan</h3>
          <ul>
            <li>Menjelaskan konsep laju reaksi dan teori tumbukan.</li>
            <li>Membuktikan faktor-faktor yang memengaruhi laju reaksi.</li>
            <li>Menentukan orde reaksi dan persamaan laju dari data.</li>
          </ul>
          <div class="box warn">
            <b>Perhatian!</b>
            <ul>
              <li>Gunakan jas lab, kacamata pelindung, dan sarung tangan.</li>
              <li>HCl dan Na₂S₂O₃ dapat mengiritasi; reaksi keduanya menghasilkan gas SO₂ berbau: kerjakan di ruang berventilasi dengan volume kecil.</li>
              <li>Hati-hati dengan air panas; gunakan penjepit tabung.</li>
              <li>H₂O₂ dapat mengiritasi kulit; jangan terkena mata.</li>
              <li>Buang limbah pada wadah yang ditentukan guru.</li>
            </ul>
          </div>
          <h3>Alat &amp; Bahan Umum</h3>
          <p>Gelas kimia, gelas ukur, tabung reaksi, termometer, stopwatch, kertas bertanda silang (X), hot plate/penangas, Na₂S₂O₃ 0,1 M, HCl 1 M, tablet effervescent, H₂O₂ 3%, ragi, air suling.</p>
          <span class="pg">3</span>
        </div>`
      ],
      ['Dasar Teori', 
        `<div class="page">
          <h2>Dasar Teori Singkat</h2>
          <ul>
            <li><b>Laju reaksi</b> = perubahan konsentrasi per satuan waktu: v = −Δ[pereaksi]/Δt = +Δ[produk]/Δt (satuan M/s).</li>
            <li><b>Teori tumbukan:</b> reaksi terjadi bila partikel bertumbukan dengan energi ≥ energi aktivasi (Eₐ) dan orientasi tepat.</li>
            <li><b>Faktor:</b> konsentrasi ↑, luas permukaan ↑, suhu ↑, dan katalis → tumbukan efektif bertambah → reaksi lebih cepat.</li>
            <li><b>Persamaan laju:</b> v = k[A]ᵐ[B]ⁿ, dengan m, n = orde reaksi, hanya dari eksperimen.</li>
          </ul>
          <h3>Profil Energi: Tanpa vs Dengan Katalis</h3>
          <svg viewBox="0 0 320 130" width="100%">
            <path d="M10 100Q70 100 110 30Q150 100 200 100" fill="none" stroke="#d32f2f" stroke-width="3"/>
            <path d="M10 100Q70 100 110 60Q150 100 200 100" fill="none" stroke="#1e88e5" stroke-width="3" stroke-dasharray="6 4"/>
            <text x="215" y="45" font-size="11" fill="#d32f2f" font-family="Arial">Eₐ tanpa katalis</text>
            <text x="215" y="68" font-size="11" fill="#1e88e5" font-family="Arial">Eₐ dengan katalis (lebih rendah)</text>
            <text x="10" y="120" font-size="10" fill="#777" font-family="Arial">Pereaksi → Produk (koordinat reaksi)</text>
          </svg>
          <div class="box">Aturan suhu (perkiraan): setiap naik 10 °C, laju menjadi 2× → v₂ = v₁ × 2^((T₂−T₁)/10).</div>
          <span class="pg">4</span>
        </div>`
      ],
      ['Praktikum 1', 
        `<div class="page">
          <h2>Praktikum 1: Pengaruh Konsentrasi</h2>
          <p><b>Tujuan:</b> mengamati pengaruh konsentrasi Na₂S₂O₃ terhadap waktu munculnya endapan belerang (kekeruhan).</p>
          <p><b>Reaksi:</b> Na₂S₂O₃ + 2HCl → 2NaCl + H₂O + SO₂ + S↓</p>
          <h3>Prosedur (bergambar)</h3>
          <div class="steps">
            ${fig(bk('#e0e0e0', 'Na₂S₂O₃+air', { h: 50 }), 'Campur Na₂S₂O₃ 0,1 M dan air sesuai tabel (total 10 mL) di gelas kimia', 1)}
            ${fig(bk('#e0e0e0', 'tanda X', { h: 50, drop: '#455a64' }), 'Letakkan gelas di atas kertas bertanda X', 2)}
            ${fig(bk('#e0e0e0', '+ 5 mL HCl', { h: 50, drop: '#e53935' }), 'Tambah 5 mL HCl 1 M, mulai stopwatch', 3)}
            ${fig(sw('waktu t'), 'Hentikan stopwatch saat tanda X tidak terlihat', 4)}
          </div>
          <h3>Tabel Pengamatan</h3>
          <table class="fill">
            <tr><th>No</th><th>V Na₂S₂O₃ (mL)</th><th>V air (mL)</th><th>Waktu t (s)</th><th>1/t (s⁻¹)</th></tr>
            <tr><td>1</td><td>10</td><td>0</td><td></td><td></td></tr>
            <tr><td>2</td><td>8</td><td>2</td><td></td><td></td></tr>
            <tr><td>3</td><td>6</td><td>4</td><td></td><td></td></tr>
            <tr><td>4</td><td>4</td><td>6</td><td></td><td></td></tr>
          </table>
          <p><b>Diskusi:</b> buat grafik 1/t terhadap konsentrasi. Bagaimana hubungannya? Jelaskan dengan teori tumbukan.</p>
          <span class="pg">5</span>
        </div>`
      ],
      ['Praktikum 2', 
        `<div class="page">
          <h2>Praktikum 2: Pengaruh Luas Permukaan</h2>
          <p><b>Tujuan:</b> membandingkan laju reaksi tablet effervescent utuh dan yang dihaluskan.</p>
          <p><b>Bahan:</b> 3 tablet effervescent (yang sama), 3 gelas kimia berisi 100 mL air bersuhu ruang, stopwatch, mortar.</p>
          <h3>Prosedur (bergambar)</h3>
          <div class="steps">
            ${fig(tab('#b3e5fc', '100 mL air', ''), 'Siapkan 3 gelas berisi air 100 mL pada suhu sama', 1)}
            ${fig(tab('#b3e5fc', 'utuh', whole), 'Gelas A: 1 tablet utuh', 2)}
            ${fig(tab('#b3e5fc', 'dihaluskan', crush), 'Gelas B: tablet dibelah 4; Gelas C: tablet digerus halus', 3)}
            ${fig(sw('t sampai habis'), 'Masukkan bersamaan, catat waktu hingga gelembung berhenti', 4)}
          </div>
          <h3>Tabel Pengamatan</h3>
          <table class="fill">
            <tr><th>Gelas</th><th>Bentuk tablet</th><th>Waktu larut (s)</th></tr>
            <tr><td>A</td><td>Utuh</td><td></td></tr>
            <tr><td>B</td><td>Dibelah 4</td><td></td></tr>
            <tr><td>C</td><td>Serbuk</td><td></td></tr>
          </table>
          <p><b>Diskusi:</b> mengapa serbuk bereaksi paling cepat? Beri contoh penerapan luas permukaan dalam industri/rumah tangga.</p>
          <span class="pg">6</span>
        </div>`
      ],
      ['Praktikum 3', 
        `<div class="page">
          <h2>Praktikum 3: Pengaruh Suhu</h2>
          <p><b>Tujuan:</b> mengamati pengaruh suhu air terhadap laju larutnya tablet effervescent.</p>
          <p><b>Bahan:</b> 4 tablet effervescent (sama), air 100 mL pada empat suhu, termometer, stopwatch.</p>
          <h3>Prosedur (bergambar)</h3>
          <div class="steps">
            ${fig(th('#e53935', 'atur suhu'), 'Siapkan air 100 mL bersuhu ±10 °C, 30 °C, 50 °C, 70 °C', 1)}
            ${fig(tab('#b3e5fc', 'ukur suhu', ''), 'Ukur suhu tiap gelas dengan termometer sebelum dipakai', 2)}
            ${fig(tab('#b3e5fc', '+ tablet', whole + bub), 'Masukkan 1 tablet utuh ke tiap gelas, mulai stopwatch', 3)}
            ${fig(sw('t (s)'), 'Catat waktu hingga tablet larut sempurna', 4)}
          </div>
          <h3>Tabel Pengamatan</h3>
          <table class="fill">
            <tr><th>Suhu (°C)</th><th>Waktu t (s)</th><th>Laju ∝ 1/t</th></tr>
            <tr><td>±10</td><td></td><td></td></tr>
            <tr><td>±30</td><td></td><td></td></tr>
            <tr><td>±50</td><td></td><td></td></tr>
            <tr><td>±70</td><td></td><td></td></tr>
          </table>
          <p><b>Diskusi:</b> apakah kenaikan 10 °C menggandakan laju? Bandingkan dengan aturan suhu pada Dasar Teori. Jelaskan peran energi kinetik partikel.</p>
          <span class="pg">7</span>
        </div>`
      ],
      ['Praktikum 4', 
        `<div class="page">
          <h2>Praktikum 4: Pengaruh Katalis</h2>
          <p><b>Tujuan:</b> mengamati pengaruh katalis (enzim katalase dalam ragi) pada penguraian H₂O₂.</p>
          <p><b>Reaksi:</b> 2H₂O₂ → 2H₂O + O₂ (gelembung O₂)</p>
          <h3>Prosedur (bergambar)</h3>
          <div class="steps">
            ${fig(tab('#e0f2f1', 'H₂O₂ 3%', ''), 'Tuang 20 mL H₂O₂ 3% ke dalam dua tabung/gelas (A dan B)', 1)}
            ${fig(tab('#e0f2f1', 'A: kontrol', ''), 'Gelas A dibiarkan tanpa tambahan (kontrol)', 2)}
            ${fig(tab('#ffe0b2', 'B: + ragi', bub), 'Gelas B: tambahkan ½ sendok teh ragi, aduk', 3)}
            ${fig(sw('amati'), 'Bandingkan tinggi busa/gelembung tiap 30 detik selama 3 menit', 4)}
          </div>
          <h3>Tabel Pengamatan</h3>
          <table class="fill">
            <tr><th>Waktu (s)</th><th>A (kontrol)</th><th>B (+ ragi)</th></tr>
            <tr><td>30</td><td></td><td></td></tr>
            <tr><td>60</td><td></td><td></td></tr>
            <tr><td>120</td><td></td><td></td></tr>
            <tr><td>180</td><td></td><td></td></tr>
          </table>
          <p><b>Diskusi:</b> apakah katalis ikut habis bereaksi? Bagaimana katalis menurunkan energi aktivasi? Beri contoh katalis di industri (Haber–Bosch, konverter katalitik).</p>
          <span class="pg">8</span>
        </div>`
      ],
      ['Virtual Lab PhET', 
        `<div class="page">
          <h2>Praktikum Virtual (Virtual Lab)</h2>
          <p>Gunakan simulasi PhET (Universitas Colorado) bila alat/bahan terbatas. Dapat dijalankan di browser tanpa instalasi.</p>

    let i = 0, busy = false;
    const bookEl = document.getElementById('book'), 
          jump = document.getElementById('jump'), 
          cnt = document.getElementById('cnt');
          
    pages.forEach((p, k) => jump.add(new Option((k + 1) + '. ' + p[0], k)));
    
    function show(n, dir) {
      if (busy || n < 0 || n >= pages.length) return;
      busy = true;
      const old = bookEl.firstElementChild;
      
      const put = () => {
        bookEl.innerHTML = pages[n][1];
        const el = bookEl.firstElementChild;
        
        if (dir) el.classList.add(dir > 0 ? 'in' : 'inb');
        
        i = n;
        jump.value = n;
        cnt.textContent = (n + 1) + '/' + pages.length;
        document.getElementById('prev').disabled = (n == 0);
        document.getElementById('next').disabled = (n == pages.length - 1);
        scrollTo(0, 0);
        busy = false;
      };
      
      if (old && dir) {
        old.classList.add(dir > 0 ? 'out' : 'outb');
        setTimeout(put, 330);
      } else {
        put();
      }
    }
    
    document.getElementById('prev').onclick = () => show(i - 1, -1);
    document.getElementById('next').onclick = () => show(i + 1, 1);
    jump.onchange = () => show(+jump.value, +jump.value > i ? 1 : -1);
    
    addEventListener('keydown', e => {
      if (e.key == 'ArrowRight') show(i + 1, 1);
      if (e.key == 'ArrowLeft') show(i - 1, -1);
    });
    
    let sx = 0;
    bookEl.addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
    bookEl.addEventListener('touchend', e => {
      const d = e.changedTouches[0].clientX - sx;
      if (d < -60) show(i + 1, 1);
      if (d > 60) show(i - 1, -1);
    });
    
    show(0, 0);
  </script>
